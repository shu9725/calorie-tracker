<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>熱量赤字追蹤器</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#f9f8f5;--surface:#fff;--surface2:#f1f0eb;
  --text:#1a1a18;--text2:#6b6a65;--text3:#a0a09a;
  --border:rgba(0,0,0,0.1);--border2:rgba(0,0,0,0.18);
  --green:#1D9E75;--green-bg:#EAF3DE;--green-text:#3B6D11;
  --red:#E24B4A;--red-bg:#FCEBEB;--red-text:#A32D2D;
  --blue:#378ADD;--purple:#7B5EA7;--amber:#BA7517;
  --r-md:8px;--r-lg:12px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#1a1a18;--surface:#242422;--surface2:#2c2c2a;
  --text:#f0efea;--text2:#a0a09a;--text3:#6b6a65;
  --border:rgba(255,255,255,0.1);--border2:rgba(255,255,255,0.18);
  --green-bg:#17341f;--green-text:#9FE1CB;
  --red-bg:#2e1111;--red-text:#F7C1C1;
}}
body{font-family:-apple-system,'Noto Sans TC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:1.5rem 1rem;}
.container{max-width:900px;margin:0 auto;}
h1{font-size:22px;font-weight:500;margin-bottom:.2rem;}
.subtitle{font-size:14px;color:var(--text2);margin-bottom:1.5rem;}

/* Tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:1.5rem;}
.tab{padding:8px 18px;font-size:14px;font-weight:500;cursor:pointer;border:none;background:none;color:var(--text2);border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s;}
.tab.active{color:var(--text);border-bottom-color:var(--text);}
.tab-content{display:none;}.tab-content.active{display:block;}

/* Common */
button{background:var(--surface);border:.5px solid var(--border2);border-radius:var(--r-md);padding:6px 14px;cursor:pointer;color:var(--text);font-size:14px;font-family:inherit;transition:background .15s;}
button:hover{background:var(--surface2);}
button.primary{background:var(--text);color:var(--bg);border-color:transparent;font-weight:500;}
button.primary:hover{opacity:.85;}
select,input[type=number],input[type=text]{font-size:14px;border:.5px solid var(--border2);border-radius:var(--r-md);padding:6px 10px;background:var(--surface2);color:var(--text);font-family:inherit;outline:none;}
select:focus,input:focus{border-color:var(--blue);}

.section-title{font-size:13px;font-weight:500;color:var(--text2);letter-spacing:.04em;text-transform:uppercase;margin-bottom:10px;margin-top:1.5rem;}
.card{background:var(--surface);border:.5px solid var(--border);border-radius:var(--r-lg);padding:1rem 1.25rem;margin-bottom:1rem;}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:1.5rem;}
.metric-card{background:var(--surface2);border-radius:var(--r-md);padding:1rem;}
.metric-label{font-size:12px;color:var(--text2);margin-bottom:6px;display:flex;align-items:center;gap:5px;}
.metric-value{font-size:20px;font-weight:500;}
.metric-value .unit{font-size:12px;color:var(--text3);font-weight:400;}
.green{color:var(--green);}.red{color:var(--red);}.purple{color:var(--purple);}

/* Header row */
.header-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:1.5rem;}
.month-nav{display:flex;align-items:center;gap:12px;}
.month-label{font-size:18px;font-weight:500;min-width:130px;text-align:center;}
.goal-row{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text2);background:var(--surface);border:.5px solid var(--border);border-radius:var(--r-md);padding:6px 14px;}
.goal-row input{width:75px;font-size:14px;border:none;background:transparent;color:var(--text);text-align:center;font-weight:500;outline:none;}

/* Chart */
.chart-wrap{position:relative;width:100%;height:220px;margin-bottom:1.5rem;}

/* Legend */
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--text2);margin-bottom:8px;}
.legend span{display:flex;align-items:center;gap:5px;}
.legend-dot{width:10px;height:10px;border-radius:2px;display:inline-block;}

/* Quick input */
.quick-panel{background:var(--surface);border:.5px solid var(--border);border-radius:var(--r-lg);padding:1rem 1.25rem;margin-bottom:1.5rem;}
.quick-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px;}
.quick-row .lbl{font-size:13px;color:var(--text2);white-space:nowrap;}
.quick-row input[type=number]{width:110px;}

/* Week summary */
.week-summary{background:var(--surface);border:.5px solid var(--border);border-radius:var(--r-lg);padding:1rem 1.25rem;margin-bottom:10px;}
.week-title{font-size:13px;font-weight:500;color:var(--text2);margin-bottom:8px;}
.week-stats{display:flex;gap:20px;flex-wrap:wrap;font-size:13px;}
.week-stat{color:var(--text);}.week-stat span{font-weight:500;}
.pos{color:var(--green);}.neg{color:var(--red);}

/* Day grid */
.log-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin-bottom:2rem;}
.day-card{background:var(--surface);border:.5px solid var(--border);border-radius:var(--r-lg);padding:.875rem 1rem;transition:border-color .15s;}
.day-card:hover{border-color:var(--border2);}
.day-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.day-name{font-size:13px;font-weight:500;}.day-dow{font-size:11px;color:var(--text3);}
.input-group{display:flex;align-items:center;gap:6px;margin-bottom:6px;}
.input-group label{font-size:11px;color:var(--text2);width:52px;flex-shrink:0;display:flex;align-items:center;gap:3px;}
.input-group input{flex:1;font-size:13px;padding:4px 7px;}
.unit{font-size:11px;color:var(--text3);white-space:nowrap;}
.net-row{font-size:11px;color:var(--text2);margin-top:4px;}
.net-row span{font-weight:500;color:var(--text);}
.deficit-badge{font-size:11px;font-weight:500;padding:2px 8px;border-radius:var(--r-md);margin-top:6px;display:inline-block;}
.deficit-badge.surplus{background:var(--red-bg);color:var(--red-text);}
.deficit-badge.deficit{background:var(--green-bg);color:var(--green-text);}
.deficit-badge.neutral{background:var(--surface2);color:var(--text2);}

/* Formula hint */
.formula-hint{font-size:12px;color:var(--text3);background:var(--surface2);border-radius:var(--r-md);padding:8px 12px;margin-bottom:1.5rem;line-height:1.8;}
.formula-hint strong{color:var(--text2);}
.save-notice{font-size:12px;color:var(--text3);text-align:center;margin-top:2rem;padding-bottom:1rem;}

/* Exercise calc */
.met-calc{background:var(--surface);border:.5px solid var(--border);border-radius:var(--r-lg);padding:1.25rem;margin-bottom:1.5rem;}
.met-calc h3{font-size:15px;font-weight:500;margin-bottom:1rem;}
.met-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:1rem;}
.met-form-group{display:flex;flex-direction:column;gap:5px;}
.met-form-group label{font-size:12px;color:var(--text2);}
.met-form-group select,.met-form-group input{width:100%;}
.met-result{background:var(--green-bg);color:var(--green-text);border-radius:var(--r-md);padding:10px 16px;font-size:14px;font-weight:500;display:none;}
.met-result.show{display:block;}
.met-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center;}

/* Weight tab */
.weight-form{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:1.5rem;}
.weight-form input{width:110px;}
.weight-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:1.5rem;}

input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{opacity:.4;}
</style>
</head>
<body>
<div class="container">
  <h1>🥗 健康追蹤器</h1>
  <p class="subtitle">熱量赤字 × 運動消耗計算 × 體重追蹤</p>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('calorie')">🔥 熱量記錄</button>
    <button class="tab" onclick="switchTab('exercise')">🏃 運動計算</button>
    <button class="tab" onclick="switchTab('weight')">⚖️ 體重追蹤</button>
  </div>

  <!-- ===== CALORIE TAB ===== -->
  <div id="tab-calorie" class="tab-content active">
    <div class="header-row">
      <div class="month-nav">
        <button onclick="changeMonth(-1)"><i class="ti ti-chevron-left"></i></button>
        <span class="month-label" id="monthLabel"></span>
        <button onclick="changeMonth(1)"><i class="ti ti-chevron-right"></i></button>
      </div>
      <div class="goal-row">
        <i class="ti ti-flame" style="color:#BA7517;font-size:16px;"></i>
        <span>每日目標</span>
        <input type="number" id="goalInput" value="1800" min="500" max="5000" step="50" oninput="updateCalorie()">
        <span>大卡</span>
      </div>
    </div>

    <div class="formula-hint">
      <strong>赤字公式：</strong>每日赤字 = 目標熱量 − 飲食攝取 + 運動消耗 &nbsp;｜&nbsp; ✅ 正數 = 達成赤字 &nbsp; ❌ 負數 = 超標
    </div>

    <div class="metrics" id="metricsArea"></div>

    <div class="section-title">本月每日攝取 vs 目標</div>
    <div class="legend">
      <span><span class="legend-dot" style="background:#378ADD;"></span>攝取（達標）</span>
      <span><span class="legend-dot" style="background:#E24B4A;"></span>攝取（超標）</span>
      <span><span class="legend-dot" style="background:rgba(123,94,167,.55);"></span>運動消耗</span>
      <span><span class="legend-dot" style="background:#aaa;border:1px dashed #888;"></span>目標</span>
    </div>
    <div class="chart-wrap"><canvas id="mainChart"></canvas></div>

    <div class="section-title">快速輸入</div>
    <div class="quick-panel">
      <div class="quick-row">
        <select id="quickDay"></select>
        <span class="lbl"><i class="ti ti-fork-knife" style="color:#BA7517;"></i> 飲食</span>
        <input type="number" id="quickCal" placeholder="攝取熱量" min="0" max="9999">
        <span class="lbl"><i class="ti ti-run" style="color:#7B5EA7;"></i> 運動</span>
        <input type="number" id="quickExer" placeholder="消耗熱量" min="0" max="9999">
        <button class="primary" onclick="quickAdd()"><i class="ti ti-plus"></i> 記錄</button>
      </div>
    </div>

    <div class="section-title">本月週摘要</div>
    <div id="weekSummaries"></div>
    <div class="section-title">每日詳細記錄</div>
    <div class="log-grid" id="logGrid"></div>
    <p class="save-notice"><i class="ti ti-device-floppy"></i> 資料自動儲存於瀏覽器</p>
  </div>

  <!-- ===== EXERCISE TAB ===== -->
  <div id="tab-exercise" class="tab-content">
    <div class="met-calc">
      <h3><i class="ti ti-calculator" style="color:var(--purple);"></i> 運動消耗計算機</h3>
      <p style="font-size:13px;color:var(--text2);margin-bottom:1rem;">公式：消耗熱量 = 體重(kg) × MET × 時間(小時)</p>
      <div class="met-form">
        <div class="met-form-group">
          <label>運動類別</label>
          <select id="metCategory" onchange="updateMetList()">
            <option value="walk">🚶 走路 / 跑步</option>
            <option value="bike">🚴 騎車</option>
            <option value="light">🧘 輕度活動</option>
            <option value="moderate">⚽ 中度活動</option>
            <option value="vigorous">🏃 激烈活動</option>
          </select>
        </div>
        <div class="met-form-group">
          <label>運動項目</label>
          <select id="metActivity"></select>
        </div>
        <div class="met-form-group">
          <label>體重 (kg)</label>
          <input type="number" id="metWeight" placeholder="例：60" min="20" max="200" step="0.1">
        </div>
        <div class="met-form-group">
          <label>運動時間</label>
          <div style="display:flex;gap:6px;">
            <input type="number" id="metHours" placeholder="時" min="0" max="24" style="width:60px;">
            <input type="number" id="metMins" placeholder="分" min="0" max="59" style="width:60px;">
          </div>
        </div>
      </div>
      <div class="met-actions">
        <button class="primary" onclick="calcMet()"><i class="ti ti-calculator"></i> 計算消耗</button>
        <button onclick="addMetToDay()"><i class="ti ti-calendar-plus"></i> 加入今日記錄</button>
        <button onclick="clearMetCalc()" style="color:var(--text3);">清除</button>
      </div>
      <div class="met-result" id="metResult"></div>
    </div>

    <div class="section-title">常見運動 MET 值參考表</div>
    <div id="metTableArea"></div>
  </div>

  <!-- ===== WEIGHT TAB ===== -->
  <div id="tab-weight" class="tab-content">
    <div class="header-row">
      <div class="month-nav">
        <button onclick="changeWeightMonth(-1)"><i class="ti ti-chevron-left"></i></button>
        <span class="month-label" id="weightMonthLabel"></span>
        <button onclick="changeWeightMonth(1)"><i class="ti ti-chevron-right"></i></button>
      </div>
      <div class="goal-row">
        <i class="ti ti-target" style="color:var(--green);font-size:16px;"></i>
        <span>目標體重</span>
        <input type="number" id="weightGoalInput" placeholder="kg" min="20" max="300" step="0.1" oninput="updateWeight()">
        <span>kg</span>
      </div>
    </div>

    <div class="weight-stats" id="weightStats"></div>

    <div class="section-title">體重趨勢圖</div>
    <div class="chart-wrap"><canvas id="weightChart"></canvas></div>

    <div class="section-title">記錄體重</div>
    <div class="quick-panel">
      <div class="quick-row">
        <select id="weightDay"></select>
        <input type="number" id="weightInput" placeholder="體重 (kg)" min="20" max="300" step="0.1" style="width:130px;">
        <button class="primary" onclick="addWeight()"><i class="ti ti-plus"></i> 記錄</button>
      </div>
    </div>

    <div class="log-grid" id="weightGrid"></div>
    <p class="save-notice"><i class="ti ti-device-floppy"></i> 資料自動儲存於瀏覽器</p>
  </div>
</div>

  ]
};
const CAT_LABELS={walk:'走路 / 跑步',bike:'騎車',light:'輕度活動',moderate:'中度活動',vigorous:'激烈活動'};

// ==================== STATE ====================
const now=new Date();
let viewYear=now.getFullYear(), viewMonth=now.getMonth();
let wViewYear=now.getFullYear(), wViewMonth=now.getMonth();
let calChart=null, weightChart=null;
let lastMetKcal=0;

// ==================== STORAGE ====================
function calKey(){return`cht2_cal_${viewYear}_${viewMonth}`;}
function wKey(){return`cht2_w_${wViewYear}_${wViewMonth}`;}
function getCalData(){try{return JSON.parse(localStorage.getItem(calKey())||'{}')}catch{return{}}}
function saveCalData(d){localStorage.setItem(calKey(),JSON.stringify(d));}
function getWData(){try{return JSON.parse(localStorage.getItem(wKey())||'{}')}catch{return{}}}
function saveWData(d){localStorage.setItem(wKey(),JSON.stringify(d));}
function getGoal(){return parseInt(document.getElementById('goalInput').value)||1800;}
function getDays(y,m){return new Date(y,m+1,0).getDate();}
const MONTHS=['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
const DOWS=['日','一','二','三','四','五','六'];
const WDOWS=['週日','週一','週二','週三','週四','週五','週六'];

// ==================== TABS ====================
function switchTab(t){
  document.querySelectorAll('.tab-content').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(el=>el.classList.remove('active'));
  document.getElementById('tab-'+t).classList.add('active');
  event.target.classList.add('active');
  if(t==='calorie')updateCalorie();
  if(t==='exercise'){updateMetList();renderMetTable();}
  if(t==='weight')updateWeight();
}

// ==================== CALORIE TAB ====================
function changeMonth(d){
  viewMonth+=d;
  if(viewMonth>11){viewMonth=0;viewYear++;}
  if(viewMonth<0){viewMonth=11;viewYear--;}
  updateCalorie();
}
function updateCalorie(){
  document.getElementById('monthLabel').textContent=`${viewYear} 年 ${MONTHS[viewMonth]}`;
  buildQuickSelect();renderMetrics();renderCalChart();renderWeekSummaries();renderLog();
}
function buildQuickSelect(){
  const sel=document.getElementById('quickDay');
  const days=getDays(viewYear,viewMonth); sel.innerHTML='';
  for(let d=1;d<=days;d++){
    const o=document.createElement('option'); o.value=d;
    const dow=new Date(viewYear,viewMonth,d).getDay();
    o.textContent=`${viewMonth+1}/${d} (${WDOWS[dow]})`;
    if(d===now.getDate()&&viewYear===now.getFullYear()&&viewMonth===now.getMonth())o.selected=true;
    sel.appendChild(o);
  }
}
function quickAdd(){
  const d=parseInt(document.getElementById('quickDay').value);
  const cal=parseInt(document.getElementById('quickCal').value)||0;
  const exer=parseInt(document.getElementById('quickExer').value)||0;
  if(!cal&&!exer)return;
  const data=getCalData(); if(!data[d])data[d]={};
  if(cal>0)data[d].cal=cal; if(exer>0)data[d].exer=exer;
  saveCalData(data);
  document.getElementById('quickCal').value='';document.getElementById('quickExer').value='';
  updateCalorie();
}
function calcDef(goal,cal,exer){return goal-(cal||0)+(exer||0);}
function renderMetrics(){
  const goal=getGoal(),days=getDays(viewYear,viewMonth),data=getCalData();
  let tCal=0,tExer=0,tDef=0,lCal=0,lAny=0;
  for(let d=1;d<=days;d++){const r=data[d];if(r){if(r.cal){tCal+=r.cal;lCal++;}if(r.cal||r.exer){tDef+=calcDef(goal,r.cal||0,r.exer||0);lAny++;}if(r.exer)tExer+=r.exer;}}
  const avg=lCal?Math.round(tCal/lCal):0,defT=Math.round(tDef);
  let wDef=0,wL=0;
  const sw=new Date(now);sw.setDate(now.getDate()-now.getDay());
  for(let i=0;i<7;i++){const dd=new Date(sw);dd.setDate(sw.getDate()+i);if(dd.getFullYear()===viewYear&&dd.getMonth()===viewMonth){const r=data[dd.getDate()];if(r&&(r.cal||r.exer)){wDef+=calcDef(goal,r.cal||0,r.exer||0);wL++;}}}
  document.getElementById('metricsArea').innerHTML=`
    <div class="metric-card"><div class="metric-label"><i class="ti ti-calendar"></i>已記錄天數</div><div class="metric-value">${lAny}<span class="unit">/${days}天</span></div></div>
    <div class="metric-card"><div class="metric-label"><i class="ti ti-fork-knife" style="color:#BA7517;"></i>平均每日攝取</div><div class="metric-value">${avg>0?avg.toLocaleString():'—'}<span class="unit">大卡</span></div></div>
    <div class="metric-card"><div class="metric-label"><i class="ti ti-run" style="color:#7B5EA7;"></i>本月運動消耗</div><div class="metric-value purple">${tExer>0?tExer.toLocaleString():'—'}<span class="unit">大卡</span></div></div>
    <div class="metric-card"><div class="metric-label"><i class="ti ti-trending-down"></i>本月累計赤字</div><div class="metric-value ${defT>=0?'green':'red'}">${lAny?(defT>=0?'+':'')+defT.toLocaleString():'—'}<span class="unit">大卡</span></div></div>
    <div class="metric-card"><div class="metric-label"><i class="ti ti-chart-line"></i>本週赤字</div><div class="metric-value ${wDef>=0?'green':'red'}">${wL?(wDef>=0?'+':'')+Math.round(wDef).toLocaleString():'—'}<span class="unit">大卡</span></div></div>`;
}
function renderCalChart(){
  const goal=getGoal(),days=getDays(viewYear,viewMonth),data=getCalData();
  const labels=[],intakes=[],exercises=[],goals=[],colors=[];
  for(let d=1;d<=days;d++){
    const r=data[d]||{};labels.push(`${d}`);
    intakes.push(r.cal??null);exercises.push(r.exer??null);goals.push(goal);
    colors.push(r.cal==null?'rgba(180,178,169,.2)':(r.cal-(r.exer||0))>goal?'#E24B4A':'#378ADD');
  }
  if(calChart){calChart.destroy();calChart=null;}
  calChart=new Chart(document.getElementById('mainChart'),{type:'bar',data:{labels,datasets:[
    {label:'攝取熱量',data:intakes,backgroundColor:colors,borderRadius:4,order:3},
    {label:'運動消耗',data:exercises,backgroundColor:'rgba(123,94,167,.55)',borderRadius:4,order:2},
    {label:'目標熱量',data:goals,type:'line',borderColor:'#888780',borderWidth:1.5,borderDash:[4,3],pointRadius:0,fill:false,order:1}
  ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>c.dataset.label+': '+(c.raw!==null?c.raw.toLocaleString()+' 大卡':'未記錄')}}},scales:{x:{ticks:{font:{size:11},autoSkip:true,maxRotation:0},grid:{display:false}},y:{ticks:{font:{size:11},callback:v=>v.toLocaleString()},grid:{color:'rgba(136,135,128,.1)'},suggestedMin:0}}}});
}
function renderWeekSummaries(){
  const goal=getGoal(),days=getDays(viewYear,viewMonth),data=getCalData();
  const weeks=[];let week=[];
  for(let d=1;d<=days;d++){week.push(d);if(new Date(viewYear,viewMonth,d).getDay()===6||d===days){weeks.push([...week]);week=[];}}
  let html='';
  weeks.forEach((wk,wi)=>{
    let wC=0,wE=0,wD=0,wL=0;
    wk.forEach(d=>{const r=data[d];if(r&&(r.cal||r.exer)){wC+=r.cal||0;wE+=r.exer||0;wD+=calcDef(goal,r.cal||0,r.exer||0);wL++;}});
    const dr=Math.round(wD);
    html+=`<div class="week-summary"><div class="week-title">第${wi+1}週 ${viewMonth+1}/${wk[0]}–${viewMonth+1}/${wk[wk.length-1]}</div><div class="week-stats">
      <div class="week-stat">已記錄<span>${wL}/${wk.length}天</span></div>
      ${wL?`<div class="week-stat">飲食<span>${wC.toLocaleString()}大卡</span></div>`:''}
      ${wE?`<div class="week-stat">運動<span style="color:var(--purple)">${wE.toLocaleString()}大卡</span></div>`:''}
      ${wL?`<div class="week-stat">週赤字<span class="${dr>=0?'pos':'neg'}">${dr>=0?'+':''}${dr.toLocaleString()}大卡</span></div>`:'<span style="color:var(--text3)">尚無記錄</span>'}
    </div></div>`;
  });
  document.getElementById('weekSummaries').innerHTML=html;
}
function renderLog(){
  const goal=getGoal(),days=getDays(viewYear,viewMonth),data=getCalData();
  let html='';
  for(let d=1;d<=days;d++){
    const r=data[d]||{};const dow=new Date(viewYear,viewMonth,d).getDay();
    const has=r.cal!==undefined||r.exer!==undefined;
    const diff=has?calcDef(goal,r.cal||0,r.exer||0):null;
    const net=has?(r.cal||0)-(r.exer||0):null;
    const badge=diff!==null?`<div class="deficit-badge ${diff>0?'deficit':diff<0?'surplus':'neutral'}">${diff>0?'赤字 +':diff<0?'超標 ':'達標 '}${diff!==0?Math.abs(diff).toLocaleString()+' 大卡':''}</div>`:'';
    html+=`<div class="day-card" id="dc-${d}">
      <div class="day-header"><span class="day-name">${viewMonth+1}/${d}</span><span class="day-dow">${DOWS[dow]}</span></div>
      <div class="input-group"><label><i class="ti ti-fork-knife" style="color:#BA7517;"></i>飲食</label><input type="number" min="0" max="9999" placeholder="攝取熱量" value="${r.cal??''}" oninput="setDay(${d},'cal',this.value)"><span class="unit">大卡</span></div>
      <div class="input-group"><label><i class="ti ti-run" style="color:#7B5EA7;"></i>運動</label><input type="number" min="0" max="9999" placeholder="消耗熱量" value="${r.exer??''}" oninput="setDay(${d},'exer',this.value)"><span class="unit">大卡</span></div>
      ${net!==null?`<div class="net-row">淨攝取 <span>${net.toLocaleString()}</span> 大卡</div>`:''}
      ${badge}
    </div>`;
  }
  document.getElementById('logGrid').innerHTML=html;
}
function setDay(d,field,val){
  const n=parseInt(val),data=getCalData();
  if(!data[d])data[d]={};
  if(!val||isNaN(n)||n<=0)delete data[d][field]; else data[d][field]=n;
  if(!data[d].cal&&!data[d].exer)delete data[d];
  saveCalData(data);
  renderMetrics();renderCalChart();renderWeekSummaries();
  const card=document.getElementById(`dc-${d}`);if(!card)return;
  const goal=getGoal(),r=data[d]||{};
  const has=r.cal!==undefined||r.exer!==undefined;
  const diff=has?calcDef(goal,r.cal||0,r.exer||0):null;
  const net=has?(r.cal||0)-(r.exer||0):null;
  const ob=card.querySelector('.deficit-badge'),on=card.querySelector('.net-row');
  if(ob)ob.remove();if(on)on.remove();
  if(net!==null){const el=document.createElement('div');el.className='net-row';el.innerHTML=`淨攝取 <span>${net.toLocaleString()}</span> 大卡`;card.appendChild(el);}
  if(diff!==null){const b=document.createElement('div');b.className=`deficit-badge ${diff>0?'deficit':diff<0?'surplus':'neutral'}`;b.textContent=(diff>0?'赤字 +':diff<0?'超標 ':'達標 ')+(diff!==0?Math.abs(diff).toLocaleString()+' 大卡':'');card.appendChild(b);}
}

// ==================== EXERCISE TAB ====================
function updateMetList(){
  const cat=document.getElementById('metCategory').value;
  const sel=document.getElementById('metActivity');sel.innerHTML='';
  MET_DATA[cat].forEach(item=>{const o=document.createElement('option');o.value=item.met;o.textContent=`${item.name}（MET ${item.met}）`;sel.appendChild(o);});
}
function calcMet(){
  const met=parseFloat(document.getElementById('metActivity').value);
  const weight=parseFloat(document.getElementById('metWeight').value);
  const h=parseInt(document.getElementById('metHours').value)||0;
  const m=parseInt(document.getElementById('metMins').value)||0;
  if(!weight||(!h&&!m)){alert('請輸入體重和運動時間');return;}
  const hours=h+m/60;
  const kcal=Math.round(weight*met*hours);
  lastMetKcal=kcal;
  const res=document.getElementById('metResult');
  const actName=document.getElementById('metActivity').options[document.getElementById('metActivity').selectedIndex].text;
  res.innerHTML=`<i class="ti ti-flame"></i> 消耗熱量：<strong>${kcal.toLocaleString()} 大卡</strong>&nbsp;&nbsp;（${actName}，${weight}kg，${h}時${m}分）`;
  res.classList.add('show');
}
function addMetToDay(){
  if(!lastMetKcal){alert('請先計算消耗熱量');return;}
  const d=now.getDate();
  if(viewMonth!==now.getMonth()||viewYear!==now.getFullYear()){
    viewMonth=now.getMonth();viewYear=now.getFullYear();
  }
  const data=getCalData();if(!data[d])data[d]={};
  data[d].exer=(data[d].exer||0)+lastMetKcal;
  saveCalData(data);
  document.getElementById('quickExer').value=data[d].exer;
  alert(`已將 ${lastMetKcal} 大卡加入今日（${viewMonth+1}/${d}）運動消耗`);
  updateCalorie();
}
function clearMetCalc(){
  document.getElementById('metWeight').value='';
  document.getElementById('metHours').value='';
  document.getElementById('metMins').value='';
  document.getElementById('metResult').classList.remove('show');
  lastMetKcal=0;
}
function renderMetTable(){
  const area=document.getElementById('metTableArea');
  let html='';
  Object.keys(MET_DATA).forEach(cat=>{
    html+=`<div class="card"><h3 style="font-size:14px;font-weight:500;margin-bottom:10px;">${CAT_LABELS[cat]}</h3><table style="width:100%;border-collapse:collapse;font-size:13px;">`;
    html+='<thead><tr><th style="text-align:left;padding:4px 8px;color:var(--text2);font-weight:500;border-bottom:1px solid var(--border);">運動項目</th><th style="text-align:right;padding:4px 8px;color:var(--text2);font-weight:500;border-bottom:1px solid var(--border);">MET</th></tr></thead><tbody>';
    MET_DATA[cat].forEach((item,i)=>{html+=`<tr style="background:${i%2===0?'transparent':'var(--surface2)'}"><td style="padding:5px 8px;">${item.name}</td><td style="padding:5px 8px;text-align:right;font-weight:500;">${item.met}</td></tr>`;});
    html+='</tbody></table></div>';
  });
  area.innerHTML=html;
}

// ==================== WEIGHT TAB ====================
function changeWeightMonth(d){
  wViewMonth+=d;
  if(wViewMonth>11){wViewMonth=0;wViewYear++;}
  if(wViewMonth<0){wViewMonth=11;wViewYear--;}
  updateWeight();
}
function updateWeight(){
  document.getElementById('weightMonthLabel').textContent=`${wViewYear} 年 ${MONTHS[wViewMonth]}`;
  buildWeightDaySelect();renderWeightStats();renderWeightChart();renderWeightGrid();
}
function buildWeightDaySelect(){
  const sel=document.getElementById('weightDay');
  const days=getDays(wViewYear,wViewMonth);sel.innerHTML='';
  for(let d=1;d<=days;d++){
    const o=document.createElement('option');o.value=d;
    const dow=new Date(wViewYear,wViewMonth,d).getDay();
    o.textContent=`${wViewMonth+1}/${d} (${WDOWS[dow]})`;
    if(d===now.getDate()&&wViewYear===now.getFullYear()&&wViewMonth===now.getMonth())o.selected=true;
    sel.appendChild(o);
  }
}
function addWeight(){
  const d=parseInt(document.getElementById('weightDay').value);
  const w=parseFloat(document.getElementById('weightInput').value);
  if(!w||w<20)return;
  const data=getWData();data[d]=w;saveWData(data);
  document.getElementById('weightInput').value='';
  updateWeight();
}
function renderWeightStats(){
  const data=getWData();const days=getDays(wViewYear,wViewMonth);
  const vals=Object.values(data).filter(Boolean);
  const goal=parseFloat(document.getElementById('weightGoalInput').value)||null;
  if(!vals.length){document.getElementById('weightStats').innerHTML='<div class="metric-card"><div class="metric-label">尚無體重記錄</div></div>';return;}
  const latest=data[Math.max(...Object.keys(data).map(Number))];
  const max=Math.max(...vals),min=Math.min(...vals);
  const diff=vals.length>1?latest-vals[0]:null;
  let html=`
    <div class="metric-card"><div class="metric-label"><i class="ti ti-scale"></i>最新體重</div><div class="metric-value">${latest}<span class="unit">kg</span></div></div>
    <div class="metric-card"><div class="metric-label"><i class="ti ti-arrow-up"></i>本月最高</div><div class="metric-value">${max}<span class="unit">kg</span></div></div>
    <div class="metric-card"><div class="metric-label"><i class="ti ti-arrow-down"></i>本月最低</div><div class="metric-value">${min}<span class="unit">kg</span></div></div>`;
  if(diff!==null)html+=`<div class="metric-card"><div class="metric-label"><i class="ti ti-trending-${diff<=0?'down':'up'}"></i>本月變化</div><div class="metric-value ${diff<=0?'green':'red'}">${diff>0?'+':''}${diff.toFixed(1)}<span class="unit">kg</span></div></div>`;
  if(goal&&latest)html+=`<div class="metric-card"><div class="metric-label"><i class="ti ti-target"></i>距目標</div><div class="metric-value ${latest<=goal?'green':'red'}">${(latest-goal)>0?'+':''}${(latest-goal).toFixed(1)}<span class="unit">kg</span></div></div>`;
  document.getElementById('weightStats').innerHTML=html;
}
function renderWeightChart(){
  const data=getWData();const days=getDays(wViewYear,wViewMonth);
  const labels=[],vals=[],goal=parseFloat(document.getElementById('weightGoalInput').value)||null;
  for(let d=1;d<=days;d++){labels.push(`${d}`);vals.push(data[d]??null);}
  if(weightChart){weightChart.destroy();weightChart=null;}
  const datasets=[{label:'體重',data:vals,borderColor:'#378ADD',backgroundColor:'rgba(55,138,221,.15)',borderWidth:2,pointRadius:4,pointBackgroundColor:'#378ADD',fill:true,tension:.3,spanGaps:true}];
  if(goal)datasets.push({label:'目標體重',data:Array(days).fill(goal),borderColor:'#1D9E75',borderWidth:1.5,borderDash:[4,3],pointRadius:0,fill:false});
  weightChart=new Chart(document.getElementById('weightChart'),{type:'line',data:{labels,datasets},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>c.dataset.label+': '+(c.raw!==null?c.raw+' kg':'未記錄')}}},scales:{x:{ticks:{font:{size:11},autoSkip:true,maxRotation:0},grid:{display:false}},y:{ticks:{font:{size:11},callback:v=>v+' kg'},grid:{color:'rgba(136,135,128,.1)'}}}}});
}
function renderWeightGrid(){
  const data=getWData();const days=getDays(wViewYear,wViewMonth);
  let html='';
  for(let d=1;d<=days;d++){
    const v=data[d];const dow=new Date(wViewYear,wViewMonth,d).getDay();
    html+=`<div class="day-card" id="wdc-${d}">
      <div class="day-header"><span class="day-name">${wViewMonth+1}/${d}</span><span class="day-dow">${DOWS[dow]}</span></div>
      <div class="input-group"><label><i class="ti ti-scale"></i>體重</label><input type="number" min="20" max="300" step="0.1" placeholder="kg" value="${v??''}" oninput="setWeight(${d},this.value)"><span class="unit">kg</span></div>
    </div>`;
  }
  document.getElementById('weightGrid').innerHTML=html;
}
function setWeight(d,val){
  const n=parseFloat(val);const data=getWData();
  if(!val||isNaN(n)||n<20)delete data[d]; else data[d]=n;
  saveWData(data);renderWeightStats();renderWeightChart();
}

// ==================== INIT ====================
updateMetList();
updateCalorie();
updateWeight();
</script>
</body>
</html>
